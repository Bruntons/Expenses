<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruntons Expenses</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Bruntons theme: navy bar with a gold rule, white working surface,
   condensed uppercase headings, gold primary action.
   Layout: left, the till where you key an expense in; right, the month as a receipt. */
:root {
  color-scheme: light;
  --counter: #f2f4f9;
  --paper: #ffffff;
  --ink: #14224a;
  --muted: #5a6685;
  --rule: #d3d9e7;
  --accent: #1c3a80;
  --navy: #0a2a5c;
  --bar-muted: #b6c2e0;
  --gold: #e2a925;
  --gold-ink: #14224a;
  --till: #0a2a5c;
  --till-fg: #ffffff;
  --till-dim: #9fb0d8;
  --danger: #c0271f;
  --shadow: 0 1px 2px rgba(20, 34, 74, .08), 0 12px 28px -14px rgba(20, 34, 74, .3);
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--counter);
  color: var(--ink);
  font: 400 1rem/1.5 var(--body);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 20px 72px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 430px);
  grid-template-areas: "form receipt" "split receipt";
  grid-template-rows: auto 1fr;
  gap: 24px 40px;
  align-items: start;
}
@media (max-width: 820px) {
  .wrap {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "form" "receipt" "split";
    grid-template-rows: none;
    padding: 20px 16px 56px;
  }
}

/* ---------- bar ---------- */
.topbar { background: var(--navy); border-bottom: 3px solid var(--gold); color: #fff; }
.bar-in { max-width: 1000px; margin: 0 auto; padding: 16px 20px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; min-width: 0; }
.logo { display: block; height: 52px; width: auto; max-width: 100%; border-radius: 8px; }
.brand-text { border-left: 1px solid rgba(255, 255, 255, .22); padding-left: 18px; }
.topbar :focus-visible { outline-color: var(--gold); }
h1 {
  margin: 0;
  font: 700 1.35rem/1 var(--display);
  letter-spacing: .1em;
  color: var(--bar-muted);
  text-transform: uppercase;
}
.status { margin: 4px 0 0; color: var(--bar-muted); font-size: .875rem; }
.status.warn { color: #ffb9b0; }
.currency { display: flex; align-items: center; gap: 8px; font-size: .875rem; font-weight: 500; color: var(--bar-muted); }
select {
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(255, 255, 255, .28);
  border-radius: 6px;
  padding: 6px 8px;
  color: #fff;
  font-family: var(--mono);
  font-size: .875rem;
}
select option { color: #14224a; background: #fff; }

/* ---------- till (entry form) ---------- */
.till { grid-area: form; display: flex; flex-direction: column; gap: 18px; }
.till h2, .split h2 {
  margin: 0;
  font: 600 .75rem/1 var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.lcd {
  background: var(--till);
  color: var(--till-fg);
  border-radius: 12px;
  padding: 14px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
}
.lcd label { font: 500 .6875rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--till-dim); }
.lcd-row { display: flex; align-items: baseline; gap: 10px; }
.lcd-sym { font: 500 clamp(1.5rem, 5vw, 2rem)/1 var(--mono); color: var(--till-dim); }
.lcd input {
  flex: 1;
  min-width: 0;
  width: 100%;
  background: transparent;
  border: 0;
  padding: 4px 0;
  color: var(--till-fg);
  font: 500 clamp(2.4rem, 9vw, 3.4rem)/1.1 var(--mono);
  font-variant-numeric: tabular-nums;
  text-align: right;
  caret-color: var(--till-fg);
}
.lcd input::placeholder { color: var(--till-dim); opacity: .55; }
.lcd input:focus { outline: none; }
.lcd:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { margin: -10px 0 0; color: var(--danger); font-size: .875rem; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > legend { font-size: .875rem; font-weight: 500; padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
.text {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 10px 12px;
  width: 100%;
  min-width: 0;
}
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 170px); gap: 14px; }
@media (max-width: 440px) { .pair { grid-template-columns: minmax(0, 1fr); } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px 7px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  font-size: .875rem;
  cursor: pointer;
  user-select: none;
}
.chip b { font: 600 .6875rem/1 var(--mono); color: var(--muted); padding: 4px 5px; border-radius: 999px; background: var(--counter); }
.chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip input:checked + span b { background: transparent; color: inherit; opacity: .7; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 8px;
  padding: 12px 22px;
  font-weight: 600;
}
.primary:disabled { opacity: .6; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: .9375rem; }

/* ---------- receipt ---------- */
.receipt {
  grid-area: receipt;
  position: relative;
  background: var(--paper);
  box-shadow: var(--shadow);
  padding: 22px 22px 18px;
  font-family: var(--mono);
  font-size: .875rem;
  font-variant-numeric: tabular-nums;
  margin-bottom: 10px;
}
.receipt::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 100%;
  height: 8px;
  background: conic-gradient(from 135deg at 50% 0, var(--paper) 90deg, transparent 0) 0 0 / 14px 8px repeat-x;
}
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month h2 { margin: 0; font: 600 .8125rem/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; text-align: center; }
.step {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  width: 36px; height: 32px;
  font: 500 1rem/1 var(--mono);
}
.total { margin: 18px 0 2px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.total span { font-weight: 600; letter-spacing: .12em; }
.total strong { font: 800 clamp(2rem, 7vw, 2.6rem)/1 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.sub { margin: 0; color: var(--muted); font-size: .8125rem; }
.stamp {
  display: inline-block;
  margin: 12px 0 0;
  padding: 4px 8px;
  border: 1.5px dashed var(--accent);
  color: var(--accent);
  font-weight: 600;
  font-size: .75rem;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.roll { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px dashed var(--rule); }
.day { padding: 12px 0 8px; border-bottom: 1px dashed var(--rule); }
.day-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.items { list-style: none; margin: 0; padding: 0; }
.row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  background: none;
  border: 0;
  border-radius: 4px;
  padding: 5px 2px;
  text-align: left;
  font: inherit;
}
button.row:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.code { flex: none; color: var(--muted); font-size: .75rem; font-weight: 600; width: 2.2ch; }
.note { min-width: 0; overflow-wrap: anywhere; }
.dots { flex: 1; min-width: 12px; border-bottom: 1px dotted var(--muted); opacity: .6; transform: translateY(-3px); }
.amt { flex: none; font-weight: 500; }
.row-actions { display: flex; gap: 18px; padding: 2px 2px 8px calc(2.2ch + 10px); }
.row-actions .link { font-family: var(--body); font-size: .875rem; }
.row-actions .del { color: var(--danger); }
.empty { padding: 26px 0 18px; color: var(--muted); font-family: var(--body); font-size: .9375rem; border-bottom: 1px dashed var(--rule); }
.receipt-foot { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .75rem; }
.receipt-foot .link { font-family: var(--body); }

/* ---------- breakdown ---------- */
.split { grid-area: split; display: flex; flex-direction: column; gap: 12px; }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: .9375rem; }
.bar .amt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .875rem; }
.bar .amt small { color: var(--muted); font-size: .75rem; margin-left: 6px; }
.track { grid-column: 1 / -1; height: 8px; background: color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 2px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
.split p { margin: 0; color: var(--muted); font-size: .9375rem; }

/* ---------- toast ---------- */
.toast {
  position: fixed;
  left: 50%; bottom: 20px;
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--ink);
  color: var(--paper);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: .9375rem;
  box-shadow: var(--shadow);
  z-index: 5;
}
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 2px 0; }

/* ---------- theme details ---------- */
.till h2, .split h2 { font: 700 1.3rem/1 var(--display); letter-spacing: .05em; color: var(--ink); }
.lcd { border-radius: 8px; }
.primary { background: var(--gold); color: var(--gold-ink); border-radius: 6px; font-weight: 700; }
.receipt { padding-top: 0; border: 1px solid var(--rule); border-bottom: 0; }
.month { background: var(--navy); color: #fff; margin: 0 -23px; padding: 10px 14px; border-bottom: 3px solid var(--gold); }
.month h2 { font: 700 1.1rem/1 var(--display); letter-spacing: .08em; color: #fff; }
.step { border-color: rgba(255, 255, 255, .3); color: #fff; }
.step:focus-visible { outline-color: var(--gold); }
.total span { font: 700 1rem/1 var(--display); letter-spacing: .1em; }
.total strong { font: 700 clamp(2.2rem, 7vw, 2.8rem)/1 var(--display); letter-spacing: 0; }
.stamp { border-color: var(--gold); color: var(--ink); background: color-mix(in srgb, var(--gold) 18%, transparent); }
.day-head { font: 600 .875rem/1.2 var(--display); letter-spacing: .08em; }
.lcd select { flex: none; align-self: center; font-size: 1rem; padding: 8px; }
.more { color: var(--ink); font-weight: 600; font-size: .9375rem; margin-bottom: 4px; }
.cur-head { font: 600 .75rem/1 var(--mono); letter-spacing: .1em; color: var(--muted); margin-top: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
select.text { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font-family: var(--body); font-size: 1rem; }
.who-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.who-row select { flex: 1; min-width: 180px; }
.who-add { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.who-add input { flex: 1; min-width: 160px; }
.ghost { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; font-weight: 600; }
.note small { color: var(--muted); font-size: .75rem; }
#who-title { margin-top: 12px; }
.who-bar { display: flex; flex-direction: column; gap: 6px; min-width: min(280px, 100%); }
.who-bar > label { font-size: .875rem; font-weight: 500; color: var(--bar-muted); }
.topbar select { font-family: var(--body); font-size: 1rem; padding: 8px 10px; }
.topbar .link { color: #fff; }
.topbar .text, .topbar .ghost { color: var(--ink); }
.receipt-foot .ghost { font-family: var(--body); font-size: .875rem; color: var(--ink); padding: 8px 12px; }
.hint { margin: 6px 0 0; color: var(--muted); font-size: .8125rem; }
.field-label { font-size: .875rem; font-weight: 500; }
.shot-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.shot-btn { display: inline-block; cursor: pointer; }
.shot-row input:focus-visible + .shot-btn { outline: 2px solid var(--accent); outline-offset: 2px; }
.shot { display: block; max-width: 100%; border: 1px solid var(--rule); border-radius: 4px; }
#shot-preview { max-height: 200px; width: auto; margin-top: 6px; }
.photo-view { padding: 0 2px 10px calc(2.2ch + 10px); font-family: var(--body); color: var(--muted); font-size: .875rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

      <div class="brand-text">
      <h1>Expense Ledger</h1>
      <p class="status" id="status" role="status">Opening your ledger…</p>
      </div>
    </div>
      <div class="who-bar">
      <label for="who">Name</label>
      <div class="who-row">
        <select id="who"></select>
        <button class="link" id="who-remove" type="button" hidden>Remove from list</button>
      </div>
      <div class="who-add" id="who-add" hidden>
        <input class="text" id="who-new" type="text" maxlength="60" placeholder="Name to add" aria-label="Name to add">
        <button class="ghost" id="who-save" type="button">Add name</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <form class="till" id="form" novalidate autocomplete="off">
    <h2 id="form-title">Log an expense</h2>
    <div class="lcd">
      <label for="amount">Amount</label>
      <div class="lcd-row">
        <select id="cur" aria-label="Currency"></select>
        <input id="amount" name="amount" type="text" inputmode="decimal" placeholder="0.00" aria-describedby="amount-err">
      </div>
    </div>
    <p class="err" id="amount-err" role="alert" hidden></p>

    <div class="pair">
      <div class="field">
        <label for="note">What was it for?</label>
        <input class="text" id="note" name="note" type="text" maxlength="120" placeholder="Client lunch, train fare, parking">
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input class="text" id="date" name="date" type="date" required>
      </div>
    </div>

    <fieldset class="field">
      <legend>Category</legend>
      <div class="chips" id="chips"></div>
      <p class="hint" id="cat-hint" hidden>Picked from the description. Choose another to change it.</p>
    </fieldset>

    <div class="field">
      <span class="field-label">Receipt photo</span>
      <div class="shot-row">
        <input class="sr" id="shot-cam" type="file" accept="image/*" capture="environment">
        <label class="ghost shot-btn" for="shot-cam" id="shot-label">Take photo</label>
        <input class="sr" id="shot" type="file" accept="image/*">
        <label class="ghost shot-btn" for="shot">Choose from library</label>
        <button class="link" id="shot-remove" type="button" hidden>Remove photo</button>
      </div>
      <img class="shot" id="shot-preview" alt="Receipt photo for this expense" hidden>
    </div>

    <div class="actions">
      <button class="primary" id="submit" type="submit">Log expense</button>
      <button class="link" id="cancel" type="button" hidden>Cancel editing</button>
    </div>
  </form>

  <section class="receipt" aria-labelledby="month-label">
    <div class="month">
      <button class="step" id="prev-month" type="button" aria-label="Previous month">&lt;</button>
      <h2 id="month-label"></h2>
      <button class="step" id="next-month" type="button" aria-label="Next month">&gt;</button>
    </div>
    <p class="total"><span>TOTAL</span> <strong id="total"></strong></p>
    <p class="sub more" id="total-more" hidden></p>
    <p class="sub" id="sub"></p>
    <p class="stamp" id="stamp" hidden>Examples. Your first expense replaces them.</p>
    <ol class="roll" id="roll"></ol>
    <div class="receipt-foot">
      <span id="foot-note">Select an entry to edit or remove it.</span>
      <button class="ghost" id="pdf" type="button" hidden>Export to PDF</button>
      <button class="link" id="export" type="button" hidden>Copy month as CSV</button>
    </div>
  </section>

  <section class="split" aria-labelledby="split-title">
    <h2 id="split-title">Where it went</h2>
    <ul class="bars" id="bars"></ul>
    <h2 id="who-title" hidden>By name</h2>
    <ul class="bars" id="who-bars" hidden></ul>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-msg"></span>
  <button id="toast-act" type="button" hidden></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  'use strict';

  var CATS = [
    ['MI', 'Mileage'], ['FD', 'Food & Drink'], ['TR', 'Transport'], ['AC', 'Accommodation'], ['MS', 'Misc']
  ];
  var CAT_NAME = {};
  CATS.forEach(function (c) { CAT_NAME[c[0]] = c[1]; });

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var today = function () { return iso(new Date()); };
  var parseISO = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); };
  var shiftMonth = function (ym, by) {
    var p = ym.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1 + by, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  };

  var ls = {
    get: function (k, f) { try { var v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage may be unavailable */ } }
  };

  var S = {
    mode: 'boot',            // boot | cloud | local
    view: today().slice(0, 7),
    items: [],               // entries of the month in view
    all: [],                 // local mode: every entry
    loaded: false,
    net: '',                 // '' | slow | error
    editing: null,
    openId: null,
    currency: 'GBP',
    names: [],               // the list offered in the Name picker
    who: '',                 // name used last
    db: null, uid: null, dl: null,
    catManual: false,        // true once the category is chosen by hand for this entry
    native: false,           // true when the page runs as a file on its own
    unsub: null, timer: null
  };

  var CURS = ['GBP', 'EUR', 'USD', 'CAD', 'AUD', 'CHF', 'INR'];
  var fmts = {}, toastTimer;
  function fmtFor(c) {
    if (!fmts[c]) {
      try { fmts[c] = new Intl.NumberFormat(undefined, { style: 'currency', currency: c }); }
      catch (e) { fmts[c] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'GBP' }); }
    }
    return fmts[c];
  }
  var money = function (minor, cur) { return fmtFor(cur || S.currency).format(minor / 100); };
  // S.currency is the currency a new entry starts in: the one used last.
  function setCurrency(c) {
    S.currency = CURS.indexOf(c) >= 0 ? c : 'GBP';
    if (!S.editing) $('cur').value = S.currency;
  }
  // Settings (usual currency, name list, name used last) are one document, written one at a time.
  var settingsQ = Promise.resolve();
  function saveSettings() {
    ls.set('ledger.currency', S.currency); ls.set('ledger.names', S.names); ls.set('ledger.who', S.who);
    if (S.mode !== 'cloud') return;
    settingsQ = settingsQ.then(function () {
      return S.db.doc('data/users/' + S.uid + '/ledger').set({ currency: S.currency, names: S.names.slice(), who: S.who });
    }).catch(function () {});
  }
  function remember(c, who) {
    if (c === S.currency && who === S.who) return;
    S.currency = c; S.who = who;
    saveSettings();
  }

  /* ---------- names ---------- */
  var ADD = '__add';
  var byName = function (a, b) { return a.localeCompare(b); };
  function cleanName(raw) {
    var n = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim().slice(0, 60);
    return n === ADD ? '' : n;
  }
  function cleanNames(a) {
    return Array.isArray(a) ? a.map(cleanName).filter(Boolean).slice(0, 200) : [];
  }
  function addName(raw) {
    var n = cleanName(raw);
    if (!n) return '';
    var same = S.names.filter(function (x) { return x.toLowerCase() === n.toLowerCase(); })[0];
    if (same) return same;
    S.names.push(n); S.names.sort(byName);
    saveSettings();
    return n;
  }
  function syncWho() {
    var v = $('who').value;
    $('who-add').hidden = v !== ADD;
    $('who-remove').hidden = !v || v === ADD || S.names.indexOf(v) < 0;
  }
  function renderWho(sel) {
    var w = $('who'), list = S.names.slice();
    if (sel && list.indexOf(sel) < 0) list.push(sel);
    w.replaceChildren();
    w.appendChild(el('option', { value: '', text: 'No name' }));
    list.forEach(function (n) { w.appendChild(el('option', { value: n, text: n })); });
    w.appendChild(el('option', { value: ADD, text: 'Add a name…' }));
    w.value = sel || '';
    syncWho();
  }
  function noteEl(x) {
    var n = el('span', { class: 'note', text: x.note || CAT_NAME[x.cat] });
    var tags = [];
    if (x.who) tags.push(x.who);
    if (x.photo) tags.push('photo');
    if (tags.length) n.appendChild(el('small', { text: ' · ' + tags.join(' · ') }));
    return n;
  }
  // Totals per currency, never added across currencies. The usual currency comes first.
  function totals(items) {
    var m = {};
    items.forEach(function (x) { m[x.cur] = (m[x.cur] || 0) + x.amount; });
    return Object.keys(m).sort(function (a, b) {
      return a === S.currency ? -1 : b === S.currency ? 1 : a < b ? -1 : 1;
    }).map(function (k) { return [k, m[k]]; });
  }
  function moneyList(pairs) { return pairs.map(function (p) { return money(p[1], p[0]); }).join(' + '); }

  function parseAmount(str) {
    var s = String(str).replace(/[^\d.,]/g, '');
    if (!s) return NaN;
    if (s.indexOf('.') >= 0 && s.indexOf(',') >= 0) s = s.replace(/,/g, '');
    else if (s.indexOf(',') >= 0) s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
    var n = Math.round(parseFloat(s) * 100);
    return n > 0 && n < 1e11 ? n : NaN;
  }

  function el(tag, attrs) {
    var e = document.createElement(tag), k;
    for (k in (attrs || {})) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) e.appendChild(arguments[i]);
    return e;
  }

  function norm(id, d) {
    d = d || {};
    var amount = Math.round(Number(d.amount));
    return {
      id: String(id),
      amount: isFinite(amount) && amount > 0 ? amount : 0,
      note: String(d.note == null ? '' : d.note).slice(0, 120),
      cat: CAT_NAME[d.cat] ? d.cat : (d.cat === 'GR' || d.cat === 'EO') ? 'FD' : 'MS',
      cur: CURS.indexOf(d.cur) >= 0 ? d.cur : 'GBP',
      who: cleanName(d.who),
      photo: !!d.photo,
      date: /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : S.view + '-01',
      createdAt: Number(d.createdAt) || 0
    };
  }

  function examples() {
    var t = new Date(), y = new Date(t);
    y.setDate(t.getDate() - 1);
    if (y.getMonth() !== t.getMonth()) y = t;
    var a = iso(t), b = iso(y);
    return [
      { id: 'e1', note: 'Site visit, 46 miles', cat: 'MI', amount: 2070, date: a, createdAt: 5 },
      { id: 'e2', note: 'Client lunch', cat: 'FD', amount: 2840, date: a, createdAt: 4 },
      { id: 'e3', note: 'Train to Southampton', cat: 'TR', amount: 3460, date: a, createdAt: 3 },
      { id: 'e4', note: 'Hotel, 1 night', cat: 'AC', amount: 8900, date: b, createdAt: 2 },
      { id: 'e5', note: 'Phone charger', cat: 'MS', amount: 650, date: b, createdAt: 1 }
    ];
  }

  // What the receipt shows: real entries, or marked examples on a ledger never used.
  function shown() {
    var items = S.items.slice().sort(function (a, b) {

      var rows = Object.keys(sums).map(function (k) { return [k, sums[k]]; }).sort(function (a, b) { return b[1] - a[1]; });

    catch (e) { p = Promise.resolve(); }

  function showShot(rec) {

  }

  /* ---------- category from the description ---------- */
  var RULES = [
    ['MI', /\b(mileage|miles?|drove|driving|fuel|petrol|diesel|unleaded)\b/],
    ['FD', /\b(lunch|dinner|breakfast|brunch|supper|meals?|food|drinks?|coffees?|tea|restaurant|cafe|pub|bar|sandwich(es)?|snacks?|pizza|takeaway|beers?|wine|catering|subsistence|groceries|costa|starbucks|pret|greggs|mcdonalds?|nandos?)\b/],
    ['TR', /\b(trains?|rail|railcard|bus|coach|taxis?|cab|uber|tube|underground|metro|tram|flights?|plane|airline|airport|ferry|parking|car park|tolls?|car hire|hire car|rental|tickets?|fares?|congestion|ulez|eurostar|easyjet|ryanair)\b/],
    ['AC', /\b(hotels?|accommodation|airbnb|b&b|bed and breakfast|hostel|lodge|inn|guesthouse|guest house|travelodge|hilton|marriott|stay)\b/]
  ];
  // The category whose keyword comes first in the text; mileage always wins; Misc when nothing matches.
  function guessCat(text) {
    var t = String(text).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’]/g, '');
    if (!t.trim()) return '';
    var best = '', at = Infinity;
    RULES.forEach(function (r) {
      var m = r[1].exec(t);
      if (m && (r[0] === 'MI' ? at !== -1 : m.index < at)) { best = r[0]; at = r[0] === 'MI' ? -1 : m.index; }
    });
    return best || 'MS';
  }
  function autoCat() {
    if (S.catManual) return;
    var g = guessCat($('note').value), r = g && $('cat-' + g);
    if (r) r.checked = true;
    $('cat-hint').hidden = !r;
  }

  /* ---------- form ---------- */

  }

    } else setShot('none');

        undone = true;

  function onSubmit(ev) {
    ev.preventDefault();

      err.hidden = false; $('amount').focus(); return;
    }
    err.hidden = true;
    var date = /^\d{4}-\d{2}-\d{2}$/.test($('date').value) ? $('date').value : today();
    var cur = CURS.indexOf($('cur').value) >= 0 ? $('cur').value : S.currency;
    var whoSel = $('who').value, who = whoSel === ADD ? addName($('who-new').value) : cleanName(whoSel);
    var was = S.editing, item;
    try {

        note: $('note').value.trim().slice(0, 120),
        cat: selectedCat(),

  }

  /* ---------- export ---------- */
  function csv() {
    var q = function (s) { return '"' + String(s).replace(/"/g, '""') + '"'; };
    var lines = ['date,name,description,category,amount,currency'];
    shown().items.slice().reverse().forEach(function (x) {
      lines.push([x.date, q(x.who), q(x.note), q(CAT_NAME[x.cat]), (x.amount / 100).toFixed(2), x.cur].join(','));
    });

  // Saving a file: through Claude when the page is open there, or a normal

  function saveFile(name, data, mime) {

      var blob = new Blob([data], { type: mime });
      var download = function () {
        var url = URL.createObjectURL(blob), a = el('a', { href: url, download: name });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

      // On a phone, hand the file to the share sheet (Mail, Files, and so on).

            function () { resolve({ quiet: true }); },
            function (e) { if (e && e.name === 'AbortError') resolve({ quiet: true }); else download(); });

  // The month in view as an A4 PDF: header band, entries table, a total per currency.
  function buildPdf(JsPDF, items, monthName, logo, photos, who) {

        .replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x20-\xff]/g, '?');
    };

    var L = 14, R = 196, X = { date: L + 2, note: 38, cat: 134, amt: R - 2 }, y;

    doc.setFillColor(10, 42, 92); doc.rect(0, 0, 210, 26, 'F');
    doc.setFillColor(226, 169, 37); doc.rect(0, 26, 210, 1.2, 'F');
    var tx = L;

    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.text('EXPENSE LEDGER', tx, 15);
    // Whose expenses these are, and the date of the export, in the header band.
    var p = today().split('-'), shownName = safe(who || 'not selected');
    if (shownName.length > 30) shownName = shownName.slice(0, 29) + '.';
    doc.setFontSize(10);
    doc.text('Name: ' + shownName, R, 12.5, { align: 'right' });
    doc.text('Date: ' + p[2] + '/' + p[1] + '/' + p[0], R, 18.5, { align: 'right' });
    doc.setFont('helvetica', 'bold');

    doc.setTextColor(20, 34, 74); doc.setFontSize(16);
    doc.text(safe(monthName), L, 40);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 102, 133);
    doc.text(items.length + (items.length === 1 ? ' entry' : ' entries'), L, 46);
    y = 52;

    function head() {
      doc.setFillColor(10, 42, 92); doc.rect(L, y, R - L, 7, 'F');
      doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
      doc.text('DATE', X.date, y + 4.8); doc.text('DESCRIPTION', X.note, y + 4.8);
      doc.text('CATEGORY', X.cat, y + 4.8); doc.text('AMOUNT', X.amt, y + 4.8, { align: 'right' });
      y += 7;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(20, 34, 74);
    }
    function room(h) { if (y + h > 283) { doc.addPage(); y = 16; head(); } }

    head();
    items.forEach(function (x) {
      var d = x.date.split('-');
      var note = doc.splitTextToSize(safe(x.note || CAT_NAME[x.cat]), 92);
      var h = Math.max(note.length, 1) * 4.2 + 3.4;
      room(h);
      doc.text(d[2] + '/' + d[1] + '/' + d[0], X.date, y + 4.8);
      doc.text(note, X.note, y + 4.8);
      doc.text(safe(CAT_NAME[x.cat]), X.cat, y + 4.8);
      doc.text(num(x.amount) + ' ' + x.cur, X.amt, y + 4.8, { align: 'right' });
      y += h;
      doc.setDrawColor(211, 217, 231); doc.setLineWidth(0.2); doc.line(L, y, R, y);
    });

    y += 3;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    totals(items).forEach(function (t) {
      if (y + 7 > 283) { doc.addPage(); y = 16; }
      doc.text('Total ' + t[0], X.cat, y + 4.8);
      doc.text(num(t[1]) + ' ' + t[0], X.amt, y + 4.8, { align: 'right' });
      y += 6.5;
    });
    // One page per receipt photo, after the table.
    items.forEach(function (x) {
      var r = photos && photos[x.id];
      if (!r) return;
      doc.addPage();
      var d = x.date.split('-');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20, 34, 74);
      doc.text(doc.splitTextToSize(safe('Receipt: ' + d[2] + '/' + d[1] + '/' + d[0] + (x.who ? ', ' + x.who : '') + ', ' +
        (x.note || CAT_NAME[x.cat]) + ', ' + num(x.amount) + ' ' + x.cur), R - L), L, 18);
      var iw = R - L, ih = iw * r.h / r.w;
      if (ih > 250) { ih = 250; iw = ih * r.w / r.h; }
      try { doc.addImage(r.data, 'JPEG', L, 30, iw, ih); }
      catch (e) { doc.setFont('helvetica', 'normal'); doc.text('This photo could not be added.', L, 34); }
    });
    return doc.output('arraybuffer');
  }
  // The name for the export header: the one selected, else the one name the entries share.
  function exportName(items) {
    if (S.who) return S.who;
    var seen = {};
    items.forEach(function (x) { if (x.who) seen[x.who] = 1; });
    var names = Object.keys(seen);
    return names.length === 1 ? names[0] : '';
  }
  function onPdf() {
    if (!canSave() || !window.jspdf) return;
    var name = 'expenses-' + S.view + '.pdf', items = shown().items.slice().reverse();
    var withPhoto = items.filter(function (x) { return x.photo; });
    Promise.all(withPhoto.map(function (x) { return photoGet(x.id).catch(function () { return null; }); })).then(function (recs) {
      var photos = {}, buf;
      withPhoto.forEach(function (x, i) { if (recs[i]) photos[x.id] = recs[i]; });
      try {
        var monthName = parseISO(S.view + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
        buf = buildPdf(window.jspdf.jsPDF, items, monthName, document.querySelector('.logo'), photos, exportName(items));
      } catch (e) { toast('The PDF couldn’t be built. Use the CSV export instead.'); return; }
      return saveFile(name, buf, 'application/pdf').then(
        function (r) { if (!r || !r.quiet) toast('Saved ' + name + '.'); },
        function (e) { if (!e || e.code !== 'declined') toast('The download didn’t go through. Try again in a moment.'); });
    });
  }
  function onExport() {
    var text = csv(), name = 'expenses-' + S.view + '.csv';
    if (!canSave()) { copyCsv(text); return; }
    saveFile(name, text, 'text/csv;charset=utf-8').then(
      function (r) { if (!r || !r.quiet) toast('Saved ' + name + '.'); },
      function (e) { if (!e || e.code !== 'declined') toast('The download didn’t go through. Try again in a moment.'); });
  }

  /* ---------- start ---------- */
  function startLocal() {
    S.mode = 'local';
    S.all = (ls.get('ledger.local', []) || []).map(function (x) { return norm(x.id, x); });
    var c = ls.get('ledger.currency', null); if (c) setCurrency(c);
    S.loaded = true;
    setView(S.view);
  }

  function boot() {
    CATS.forEach(function (c, i) {
      var input = el('input', { type: 'radio', name: 'cat', id: 'cat-' + c[0], value: c[0] });
      if (i === 0) input.checked = true;
      $('chips').appendChild(el('label', { class: 'chip' }, input, el('span', {}, el('b', { text: c[0] }), document.createTextNode(c[1]))));
    });
    CURS.forEach(function (c) {
      var part = fmtFor(c).formatToParts(0).filter(function (p) { return p.type === 'currency'; })[0];
      var sym = part ? part.value : '';
      $('cur').appendChild(el('option', { value: c, text: sym && sym !== c ? c + ' ' + sym : c }));
    });
    setCurrency(ls.get('ledger.currency', 'GBP'));
    $('date').value = today();
    $('form').addEventListener('submit', onSubmit);
    $('cancel').addEventListener('click', clearForm);
    $('prev-month').addEventListener('click', function () { setView(shiftMonth(S.view, -1)); });
    $('next-month').addEventListener('click', function () { setView(shiftMonth(S.view, 1)); });
    $('export').addEventListener('click', onExport);
    $('pdf').addEventListener('click', onPdf);
    $('note').addEventListener('input', autoCat);
    var onShot = function () {
      var f = this.files && this.files[0];
      this.value = '';
      if (!f) return;
      shrink(f).then(function (rec) { setShot('new', rec); }, function () { toast('That photo couldn’t be read. Try taking it again.'); });
    };
    $('shot').addEventListener('change', onShot);
    $('shot-cam').addEventListener('change', onShot);
    $('shot-remove').addEventListener('click', function () { setShot('none'); });
    $('chips').addEventListener('change', function () { S.catManual = true; $('cat-hint').hidden = true; });
    S.names = cleanNames(ls.get('ledger.names', [])).sort(byName);
    S.who = cleanName(ls.get('ledger.who', ''));
    renderWho(S.who);
    $('who').addEventListener('change', function () {
      syncWho();
      if ($('who').value === ADD) { $('who-new').focus(); return; }
      // The chosen name sticks straight away, on this visit and the next.
      if (!S.editing) { S.who = cleanName($('who').value); saveSettings(); }
    });
    var saveNew = function () {
      var n = addName($('who-new').value);
      if (!n) { $('who-new').focus(); return; }
      $('who-new').value = '';
      renderWho(n);
      if (!S.editing) { S.who = n; saveSettings(); }
    };
    $('who-save').addEventListener('click', saveNew);
    $('who-new').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); saveNew(); } });
    $('who-remove').addEventListener('click', function () {
      var v = $('who').value;
      S.names = S.names.filter(function (x) { return x !== v; });
      if (S.who === v) S.who = '';
      saveSettings();
      renderWho('');
      $('who').focus();
    });
    render();

    var c = window.claude;
    if (!c || typeof c.use !== 'function') { S.native = true; startLocal(); return; }
    var use = function (n) { return Promise.resolve().then(function () { return c.use(n); }).catch(function () { return null; }); };
    Promise.all([use('db'), use('user'), use('downloads')]).then(function (r) {
      S.dl = r[2];
      var idp = r[1] ? Promise.resolve(r[1].id()).catch(function () { return null; }) : Promise.resolve(null);
      return idp.then(function (uid) {
        if (!r[0] || !uid) { startLocal(); return; }
        S.db = r[0]; S.uid = uid; S.mode = 'cloud';
        settingsQ = S.db.doc('data/users/' + uid + '/ledger').get().then(function (snap) {
          var d = snap.exists && snap.data();
          if (!d) return;
          if (typeof d.currency === 'string') setCurrency(d.currency);
          cleanNames(d.names).forEach(function (n) { if (S.names.indexOf(n) < 0) S.names.push(n); });
          S.names.sort(byName);
          if (typeof d.who === 'string') S.who = cleanName(d.who);
          ls.set('ledger.currency', S.currency); ls.set('ledger.names', S.names); ls.set('ledger.who', S.who);
          var now = $('who').value;
          renderWho(now && now !== ADD ? now : S.who);
          render();
        }).catch(function () {});
        subscribeMonth();
        render();
      });
    }).catch(function () { startLocal(); });
  }

  boot();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
